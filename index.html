<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Sportcal</title>
<style>
:root{
  --bg:#101113; --panel:#181a1c; --line:#292c2f;
  --ink:#e7e9ea; --mut:#878d92; --amber:#e8a33d;
  --live:#e05b4b; --ok:#5aa06f;
}
/* Ligafarben genau einmal definiert: --c faerbt den Chip, --a das Badge. */
.lg-nfl{--c:#4fa3d1;--a:#4fa3d1}
.lg-cfb{--c:#c98a3a;--a:#c98a3a}
.lg-bl1{--c:#cf4f4f;--a:#cf4f4f}
.lg-dfb{--c:#7d8f4a;--a:#7d8f4a}
.lg-ucl{--c:#7a6fd0;--a:#7a6fd0}
.lg-f1{--c:#b9bcc4;--a:#b9bcc4}
.lg-cycling{--c:#5aa06f;--a:#5aa06f}
.lg-atp{--c:#3fa8a0;--a:#3fa8a0}
.lg-wta{--c:#b56aa0;--a:#b56aa0}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.4}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 64px}

header{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;
  padding-bottom:14px;border-bottom:2px solid var(--line)}
h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.14em;text-transform:uppercase}
.stamp{margin-left:auto;text-align:right;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;color:var(--mut)}
.stamp b{display:block;font-weight:400;color:var(--mut)}

/* Filter: eingeklappt, Zustand im Toggle sichtbar */
.filterbar{margin:14px 0 0}
.ftoggle{display:flex;align-items:center;gap:8px;width:100%;
  border:1px solid var(--line);background:transparent;color:var(--mut);
  font:inherit;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  padding:7px 10px;border-radius:2px;cursor:pointer;text-align:left}
.ftoggle:focus-visible,.chip:focus-visible,.bulk:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ftoggle .caret{margin-left:auto;transition:transform .15s}
.ftoggle[aria-expanded="true"] .caret{transform:rotate(180deg)}
.ftoggle .active{color:var(--amber)}
.filters{display:none;flex-wrap:wrap;gap:6px;padding:10px 0 2px}
.filterbar.open .filters{display:flex}
.chip{border:1px solid var(--line);background:transparent;color:var(--mut);
  font:inherit;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 10px;border-radius:2px;cursor:pointer}
.chip[aria-pressed="true"]{color:var(--bg);background:var(--c,#ccc);border-color:var(--c,#ccc)}
.bulk{border:1px dashed var(--line);background:transparent;color:var(--mut);
  font:inherit;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 10px;border-radius:2px;cursor:pointer}

.day{margin-top:26px;padding-left:11px;border-left:3px solid transparent}
.day.today{border-left-color:var(--amber)}
.day h2{display:flex;align-items:baseline;gap:10px;margin:0 0 6px;
  font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mut);border-bottom:1px solid var(--line);padding-bottom:5px}
.day h2 .dow{color:var(--ink)}
.day h2 .rel{margin-left:auto;color:var(--amber);letter-spacing:.08em}
.day .none{font-size:12.5px;color:var(--mut);padding:8px 2px;font-style:italic}
.day .none.filtered{color:var(--amber);opacity:.8;font-style:normal}

.row{display:grid;grid-template-columns:4.6rem 6.4rem 1fr;gap:10px;
  align-items:baseline;padding:9px 2px;border-bottom:1px solid var(--line)}
.row .t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:15px;color:var(--amber);white-space:nowrap}
.row.allday .t{font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.badge{display:inline-block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  padding:2px 6px;border-radius:2px;color:#101113;background:var(--a);white-space:nowrap}
.m{grid-column:3}
.meta{grid-column:3;font-size:11.5px;color:var(--mut);margin-top:3px;letter-spacing:.02em}
.vs{color:var(--mut);font-size:12px;padding:0 2px}
.rank{color:var(--amber);font-size:12px}
.stage{color:var(--mut);font-size:12.5px;padding-left:6px}
.tv{display:inline-block;border:1px solid var(--line);border-radius:2px;
  padding:0 4px;margin-left:6px;font-size:10.5px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--mut)}
.meta .tv:first-child{margin-left:0}
.row a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.row a:hover{border-bottom-color:var(--amber)}
.is-done{opacity:.45}
.is-live .t{color:#f0f0f0}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--live);margin-left:6px;vertical-align:middle;
  animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}

.skel .row{border-bottom:1px solid var(--line)}
.skel .bar{height:11px;border-radius:2px;background:var(--panel);
  animation:sheen 1.4s ease-in-out infinite}
@keyframes sheen{0%,100%{opacity:.55}50%{opacity:1}}

footer{margin-top:40px;padding-top:12px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--mut);
  font-family:ui-monospace,Menlo,Consolas,monospace}
footer .src{display:inline-block;margin-right:14px;white-space:nowrap}
footer .ok::before{content:"\25CF";color:var(--ok);padding-right:5px}
footer .partial::before{content:"\25CF";color:var(--amber);padding-right:5px}
footer .fail::before{content:"\25CF";color:var(--live);padding-right:5px}
footer .note{color:#6f7479;padding-left:4px}
.warn{margin-top:14px;padding:9px 12px;border-left:3px solid var(--live);
  background:#1c1618;color:#e8cfc6;font-size:13px}

@media (max-width:560px){
  .row{grid-template-columns:4.2rem 1fr;gap:6px}
  .lg{grid-column:2}.m{grid-column:1 / -1}.meta{grid-column:1 / -1}
  .stamp{margin-left:0;width:100%;text-align:left}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Sportcal</h1>
    <div class="stamp"><span id="tz">&nbsp;</span><b id="stand">&nbsp;</b></div>
  </header>

  <div class="filterbar" id="filterbar">
    <button class="ftoggle" id="ftoggle" aria-expanded="false" aria-controls="filters">
      <span id="fstate">Ligen</span><span class="caret">&#9662;</span>
    </button>
    <div class="filters" id="filters" role="group" aria-label="Ligen filtern"></div>
  </div>

  <main id="cal" class="skel" aria-live="polite"></main>
  <div id="warn"></div>
  <footer id="foot"></footer>
</div>
<script>
(function(){
  "use strict";

  /* Labels und Reihenfolge der Chips. Farben stehen ausschliesslich im CSS
     als .lg-<key>, hier bewusst nicht dupliziert. */
  var LEAGUES=[
    {k:"nfl",     label:"NFL",           badge:"NFL"},
    {k:"cfb",     label:"College",       badge:"College"},
    {k:"bl1",     label:"Bundesliga",    badge:"BL"},
    {k:"dfb",     label:"DFB-Pokal",     badge:"Pokal"},
    {k:"ucl",     label:"Champions Lg.", badge:"CL"},
    {k:"f1",      label:"Formel 1",      badge:"F1"},
    {k:"cycling", label:"Radsport",      badge:"Rad"},
    {k:"atp",     label:"ATP",           badge:"ATP"},
    {k:"wta",     label:"WTA",           badge:"WTA"}
  ];
  var BADGE={},LABEL={};
  LEAGUES.forEach(function(l){BADGE[l.k]=l.badge;LABEL[l.k]=l.label;});

  var HIDDEN_KEY="sportcal.hidden", CACHE_KEY="sportcal.data";
  var DAYS=7, REFRESH_MS=30*60*1000;
  var cal=document.getElementById("cal"), foot=document.getElementById("foot"),
      warn=document.getElementById("warn"), filters=document.getElementById("filters"),
      fbar=document.getElementById("filterbar"), ftoggle=document.getElementById("ftoggle"),
      fstate=document.getElementById("fstate");
  var doc=null, hidden=load(HIDDEN_KEY,{}), fetchedAt=0;

  /* ---------- Speicher ---------- */
  function load(key,fallback){
    try{var raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback;}
    catch(e){return fallback;}
  }
  function save(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}}

  /* ---------- Datum, immer in der Zeitzone des Geraets ---------- */
  function dayKey(d){
    var m=d.getMonth()+1, day=d.getDate();
    return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day;
  }
  function fmtTime(d){
    return d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  }
  function fmtDay(d){
    return {dow:d.toLocaleDateString("de-DE",{weekday:"long"}),
            date:d.getDate()+". "+d.toLocaleDateString("de-DE",{month:"long"})};
  }
  function fmtStamp(iso){
    var d=new Date(iso);
    if(isNaN(d))return "";
    return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})+" "+fmtTime(d);
  }

  /* ---------- Rendern ---------- */
  function el(tag,cls,text){
    var n=document.createElement(tag);
    if(cls)n.className=cls;
    if(text!=null)n.textContent=text;
    return n;
  }

  function eventDay(ev){
    if(ev.allday)return ev.allday;              // Turniertag = Kalendertag, keine Umrechnung
    var d=new Date(ev.t);
    return isNaN(d)?null:dayKey(d);
  }

  function state(ev,now){
    if(ev.allday)return "";
    var start=new Date(ev.t).getTime();
    if(isNaN(start))return "";
    var end=start+(ev.dur||120)*60000;
    if(now>=end)return "is-done";
    if(now>=start)return "is-live";
    return "";
  }

  function rowNode(ev,now){
    var cls="row lg-"+ev.lg;
    var st=state(ev,now);
    if(st)cls+=" "+st;
    if(ev.allday)cls+=" allday";
    var row=el("div",cls);
    row.setAttribute("data-league",ev.lg);

    var t=el("div","t");
    if(ev.allday){t.textContent="ganztägig";}
    else{
      t.textContent=fmtTime(new Date(ev.t));
      if(st==="is-live")t.appendChild(el("span","dot"));
    }
    row.appendChild(t);

    var lg=el("div","lg");
    lg.appendChild(el("span","badge",BADGE[ev.lg]||ev.lg));
    row.appendChild(lg);

    var m=el("div","m");
    if(ev.home&&ev.away){
      if(ev.rank_home)m.appendChild(el("span","rank","#"+ev.rank_home+" "));
      m.appendChild(document.createTextNode(ev.home+" "));
      m.appendChild(el("span","vs","gegen"));
      if(ev.rank_away)m.appendChild(el("span","rank"," #"+ev.rank_away));
      m.appendChild(document.createTextNode(" "+ev.away));
    }else{
      var name=ev.n||"?";
      if(ev.u){
        var a=el("a",null,name);
        a.href=ev.u;a.target="_blank";a.rel="noopener";
        m.appendChild(a);
      }else{
        m.appendChild(document.createTextNode(name));
      }
      if(ev.s)m.appendChild(el("span","stage",ev.s));
    }
    row.appendChild(m);

    var meta=el("div","meta");
    if(ev.m)meta.appendChild(document.createTextNode(ev.m));
    (ev.tv||[]).forEach(function(ch){meta.appendChild(el("span","tv",ch));});
    if(meta.childNodes.length)row.appendChild(meta);
    return row;
  }

  function render(){
    cal.className="";
    cal.textContent="";
    if(!doc){
      cal.appendChild(el("p","day none","Keine Daten vorhanden."));
      return;
    }
    var now=Date.now(), today=new Date();
    var buckets={};
    (doc.events||[]).forEach(function(ev){
      var key=eventDay(ev);
      if(!key)return;
      (buckets[key]=buckets[key]||[]).push(ev);
    });

    for(var i=0;i<DAYS;i++){
      var d=new Date(today.getFullYear(),today.getMonth(),today.getDate()+i);
      var key=dayKey(d), all=buckets[key]||[];
      var visible=all.filter(function(ev){return !hidden[ev.lg];});
      visible.sort(function(a,b){
        if(!!a.allday!==!!b.allday)return a.allday?-1:1;   // ganztaegig zuerst
        return (a.t||"")<(b.t||"")?-1:1;
      });

      var sec=el("section","day"+(i===0?" today":""));
      var h2=el("h2");
      var f=fmtDay(d);
      h2.appendChild(el("span","dow",f.dow));
      h2.appendChild(el("span",null,f.date));
      if(i===0)h2.appendChild(el("span","rel","heute"));
      else if(i===1)h2.appendChild(el("span","rel","morgen"));
      sec.appendChild(h2);

      if(visible.length){
        visible.forEach(function(ev){sec.appendChild(rowNode(ev,now));});
      }else if(all.length){
        sec.appendChild(el("div","none filtered",
          all.length+(all.length===1?" Termin":" Termine")+" durch Filter ausgeblendet"));
      }else{
        sec.appendChild(el("div","none","keine Termine"));
      }
      cal.appendChild(sec);
    }
    renderFoot();
  }

  function renderFoot(){
    foot.textContent="";
    warn.textContent="";
    var dead=[];
    (doc.sources||[]).forEach(function(s){
      var span=el("span","src "+(s.state||"fail"),(s.label||s.key)+(s.coverage?" bis "+s.coverage:""));
      if(s.note)span.appendChild(el("span","note","("+s.note+")"));
      foot.appendChild(span);
      if(s.state==="fail")dead.push(s.label||s.key);
    });
    if(dead.length){
      warn.appendChild(el("div","warn",
        "Quelle nicht erreichbar: "+dead.join(", ")+". Diese Termine fehlen möglicherweise."));
    }
  }

  function renderHead(){
    var tz="";
    try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"";}catch(e){}
    document.getElementById("tz").textContent=tz?"Zeiten in "+tz:"";
    document.getElementById("stand").textContent=
      doc&&doc.generated?"Stand "+fmtStamp(doc.generated):"";
  }

  /* ---------- Filter ---------- */
  function buildFilters(){
    LEAGUES.forEach(function(l){
      var b=el("button","chip lg-"+l.k,l.label);
      b.type="button";
      b.setAttribute("data-league",l.k);
      b.setAttribute("aria-pressed",hidden[l.k]?"false":"true");
      b.addEventListener("click",function(){
        if(hidden[l.k])delete hidden[l.k];else hidden[l.k]=true;
        b.setAttribute("aria-pressed",hidden[l.k]?"false":"true");
        commit();
      });
      filters.appendChild(b);
    });
    var all=el("button","bulk","Alle"), none=el("button","bulk","Keine");
    all.type=none.type="button";
    all.addEventListener("click",function(){hidden={};syncChips();commit();});
    none.addEventListener("click",function(){
      hidden={};LEAGUES.forEach(function(l){hidden[l.k]=true;});syncChips();commit();
    });
    filters.appendChild(all);
    filters.appendChild(none);
  }
  function syncChips(){
    Array.prototype.forEach.call(filters.querySelectorAll(".chip"),function(b){
      b.setAttribute("aria-pressed",hidden[b.getAttribute("data-league")]?"false":"true");
    });
  }
  function commit(){
    save(HIDDEN_KEY,hidden);
    syncState();
    render();
  }
  function syncState(){
    var off=LEAGUES.filter(function(l){return hidden[l.k];}).length;
    if(!off){fstate.textContent="Ligen · alle sichtbar";}
    else{
      fstate.textContent="Ligen · ";
      fstate.appendChild(el("span","active",off+" von "+LEAGUES.length+" ausgeblendet"));
    }
  }
  ftoggle.addEventListener("click",function(){
    var open=fbar.classList.toggle("open");
    ftoggle.setAttribute("aria-expanded",open?"true":"false");
  });

  /* ---------- Laden ---------- */
  function apply(data,fromCache){
    doc=data;
    try{
      renderHead();
      render();
    }catch(err){
      // Lieber eine sichtbare Fehlermeldung als eine leere Seite.
      cal.className="";
      cal.textContent="";
      cal.appendChild(el("div","warn","Anzeige fehlgeschlagen: "+err.message));
      return;
    }
    if(!fromCache)save(CACHE_KEY,data);
  }
  function fetchData(){
    var url="data.json?t="+Date.now();
    fetch(url,{cache:"no-store"}).then(function(r){
      if(!r.ok)throw new Error(r.status);
      return r.json();
    }).then(function(data){
      fetchedAt=Date.now();
      apply(data,false);
    }).catch(function(err){
      if(!doc){
        cal.className="";
        cal.textContent="";
        cal.appendChild(el("div","warn","Daten nicht erreichbar ("+err.message+")."));
      }
    });
  }
  function skeleton(){
    for(var i=0;i<5;i++){
      var row=el("div","row");
      row.appendChild(el("div","t"));
      row.appendChild(el("div","lg"));
      var m=el("div","m");
      m.appendChild(el("div","bar"));
      row.appendChild(m);
      cal.appendChild(row);
    }
  }

  buildFilters();
  syncState();
  var cached=load(CACHE_KEY,null);
  if(cached){apply(cached,true);}else{skeleton();}
  fetchData();

  /* Live-Zustand und Tageswechsel nachziehen, ohne Reload. */
  var lastDay=dayKey(new Date());
  setInterval(function(){
    var now=dayKey(new Date());
    if(now!==lastDay){lastDay=now;fetchData();}
    if(doc)render();
  },60000);
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden&&Date.now()-fetchedAt>REFRESH_MS)fetchData();
  });
})();
</script>
</body>
</html>
